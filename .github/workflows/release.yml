name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mac-arm64
            os: macos-latest
            command: npx electron-builder --mac dmg --arm64 --publish never
          - id: mac-x64
            os: macos-latest
            command: npx electron-builder --mac dmg --x64 --publish never
          - id: windows-x64
            os: windows-latest
            command: npm run package:windows
          - id: linux-x64
            os: ubuntu-latest
            command: npm run package:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installer-${{ matrix.id }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-assets
      - name: Create checksums and publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CLAVIA_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt
          cd ..
          if ! gh release view "$CLAVIA_TAG" >/dev/null 2>&1; then
            gh release create "$CLAVIA_TAG" --verify-tag --title "Clavia $CLAVIA_TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$CLAVIA_TAG" release-assets/* --clobber
