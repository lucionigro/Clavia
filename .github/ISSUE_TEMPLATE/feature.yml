name: Proponer una mejora
description: Una idea para aprender o practicar mejor.
body:
  - type: textarea
    id: need
    attributes:
      label: Qué querés poder hacer
      description: Contá la situación musical y cómo te ayudaría.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Cómo lo imaginás
      description: No hace falta una solución técnica; un ejemplo concreto ayuda.
